<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="paperBg4" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="100%" stop-color="#E8E0D0" />
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26221E" />
      <stop offset="100%" stop-color="#161412" />
    </linearGradient>
    <linearGradient id="accentRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE5337" />
      <stop offset="100%" stop-color="#B2412A" />
    </linearGradient>
    <filter id="giftShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A241E" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Warm Canvas Background -->
  <rect width="1024" height="1024" rx="228" fill="url(#paperBg4)" />

  <!-- Thin Perimeter Line -->
  <rect x="48" y="48" width="928" height="928" rx="188" fill="none" stroke="#1C1917" stroke-width="2" stroke-opacity="0.1" />

  <!-- Gift Box Silhouette -->
  <g filter="url(#giftShadow)">
    <!-- Box Lid -->
    <rect x="262" y="380" width="500" height="96" rx="28" fill="url(#boxGrad)" />

    <!-- Box Base -->
    <rect x="292" y="492" width="440" height="300" rx="24" fill="url(#boxGrad)" />

    <!-- Vertical Vermilion Ribbon on Base -->
    <rect x="477" y="492" width="70" height="300" fill="url(#accentRibbon)" />

    <!-- Vertical Vermilion Ribbon on Lid -->
    <rect x="477" y="380" width="70" height="96" fill="url(#accentRibbon)" />

    <!-- The Ribbon Bow (Intertwined O form) -->
    <g fill="#B2412A">
      <!-- Left loop -->
      <path d="M 500 375 C 440 270, 310 260, 310 335 C 310 400, 440 380, 490 380 Z" />
      <!-- Right loop -->
      <path d="M 524 375 C 584 270, 714 260, 714 335 C 714 400, 584 380, 534 380 Z" opacity="0.9" />
      <!-- Center Knot -->
      <ellipse cx="512" cy="378" rx="36" ry="26" fill="#DE5337" />
    </g>
  </g>

  <!-- Astrological / Special Fact Starburst emitting from Gift -->
  <g fill="#DE5337">
    <path d="M 512 160 Q 512 210 535 225 Q 512 240 512 290 Q 512 240 489 225 Q 512 210 512 160 Z" />
    <!-- Secondary miniature spark -->
    <circle cx="620" cy="220" r="8" fill="#B2412A" opacity="0.75" />
    <circle cx="400" cy="245" r="6" fill="#B2412A" opacity="0.6" />
  </g>

  <!-- Editorial Typographic Detail -->
  <text x="512" y="870" 
        font-family="Georgia, serif" 
        font-size="30" 
        font-weight="bold" 
        letter-spacing="12" 
        text-anchor="middle" 
        fill="#1C1917" 
        opacity="0.8">OSIF</text>
</svg>
