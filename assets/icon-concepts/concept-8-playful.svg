<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="warmAmber" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FCEFD8" />
      <stop offset="100%" stop-color="#ECD7B5" />
    </radialGradient>
    <filter id="popShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#5E381A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Warm Sun Amber Base -->
  <rect width="1024" height="1024" rx="228" fill="url(#warmAmber)" />

  <!-- Confetti / Starburst Sparks -->
  <circle cx="280" cy="280" r="14" fill="#B2412A" />
  <circle cx="760" cy="300" r="18" fill="#B2412A" opacity="0.8" />
  <circle cx="240" cy="680" r="12" fill="#1C1917" opacity="0.3" />
  <circle cx="780" cy="690" r="14" fill="#1C1917" opacity="0.35" />

  <!-- Star ✦ top right -->
  <path d="M 680 200 Q 680 220 695 220 Q 680 220 680 240 Q 680 220 665 220 Q 680 220 680 200 Z" fill="#B2412A" />

  <!-- Central Character: Playful Bold O with Candle Flame / Birthday Spark on Top -->
  <g filter="url(#popShadow)">
    <!-- Birthday Candle Wick & Flame above 'O' -->
    <rect x="506" y="270" width="12" height="36" rx="4" fill="#1C1917" />
    <!-- Flame (Vermilion teardrop with golden center) -->
    <path d="M 512 180 C 490 225, 492 255, 512 265 C 532 255, 534 225, 512 180 Z" fill="#DE5337" />
    <circle cx="512" cy="245" r="8" fill="#FCEFD8" />

    <!-- Big Chunky Serif 'O' with smiling warmth -->
    <text x="512" y="690" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="440" 
          font-weight="bold" 
          text-anchor="middle" 
          fill="#1C1917">O</text>
  </g>

  <!-- Happy Mini Subtitle: OSIF -->
  <text x="512" y="820" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="14" 
        text-anchor="middle" 
        fill="#B2412A">OSIF</text>
</svg>
