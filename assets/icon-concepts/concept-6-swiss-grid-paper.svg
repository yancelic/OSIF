<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Paper canvas matching OSIFSplash PAPER (#F2ECE1) -->
    <radialGradient id="splashPaper" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="100%" stop-color="#EBE3D3" />
    </radialGradient>
  </defs>

  <!-- Warm Paper Background (#F2ECE1) -->
  <rect width="1024" height="1024" rx="228" fill="url(#splashPaper)" />

  <!-- Subtle 2x2 Grid Hairlines in Ink Opacity -->
  <line x1="160" y1="512" x2="864" y2="512" stroke="#1C1917" stroke-width="2" stroke-opacity="0.10" />
  <line x1="512" y1="160" x2="512" y2="864" stroke="#1C1917" stroke-width="2" stroke-opacity="0.10" />

  <!-- 4 Quadrant Letters (O, S, I, F): ALL in exact OSIFSplash BRICK (#B2412A) -->
  <!-- 'O' -->
  <text x="340" y="440" 
        font-family="Georgia, serif" 
        font-size="220" 
        font-weight="800" 
        letter-spacing="-2"
        text-anchor="middle" 
        fill="#B2412A">O</text>

  <!-- 'S' -->
  <text x="684" y="440" 
        font-family="Georgia, serif" 
        font-size="220" 
        font-weight="800" 
        letter-spacing="-2"
        text-anchor="middle" 
        fill="#B2412A">S</text>

  <!-- 'I' -->
  <text x="340" y="780" 
        font-family="Georgia, serif" 
        font-size="220" 
        font-weight="800" 
        letter-spacing="-2"
        text-anchor="middle" 
        fill="#B2412A">I</text>

  <!-- 'F' -->
  <text x="684" y="780" 
        font-family="Georgia, serif" 
        font-size="220" 
        font-weight="800" 
        letter-spacing="-2"
        text-anchor="middle" 
        fill="#B2412A">F</text>

  <!-- Center Intersection Focal Dot -->
  <circle cx="512" cy="512" r="7" fill="#B2412A" />
</svg>
